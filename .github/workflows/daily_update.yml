name: Daily NYC Construction Leads

on:

  schedule:
    - cron: "0 10 * * *"

  workflow_dispatch:


permissions:
  contents: write


jobs:

  update:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5

      with:
        python-version: "3.11"


    - name: Install packages

      run: |

        pip install pandas requests openpyxl


    - name: Run script

      env:

        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      run: |

        python scripts/update_leads.py


    - name: Save changes

      run: |

        git config user.name "github-actions"

        git config user.email "actions@github.com"

        git add .

        git commit -m "Daily construction lead update" || exit 0

        git push
